<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Digital Soat</title>

<style>
body{
    background:black;
    color:#00ffcc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

#clock{
    font-size:60px;
    border:4px solid #00ffcc;
    padding:20px 40px;
    border-radius:15px;
}
</style>
</head>

<body>

<div id="clock"></div>

<script>
function showTime(){
    let now = new Date();

    let h = now.getHours();
    let m = now.getMinutes();
    let s = now.getSeconds();

    if(h < 10) h = "0" + h;
    if(m < 10) m = "0" + m;
    if(s < 10) s = "0" + s;

    document.getElementById("clock").innerHTML = h + ":" + m + ":" + s;
}

setInterval(showTime,1000);
</script>

</body>
</html>

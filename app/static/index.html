<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debt Manager — Qarzlarni boshqarish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #1254a3;
      --primary-dark: #0d3e7a;
      --accent-color: #0b57d0;
      --bg-color: #f1f3f4;
      --card-bg: #ffffff;
      --text-main: #202124;
      --text-muted: #5f6368;
      --positive: #137333;
      --negative: #c5221f;
      --border-color: #dadce0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #1e1e24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Mobile Container Frame */
    .app-wrapper {
      width: 100%;
      max-width: 440px;
      height: 860px;
      max-height: 96vh;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      border: 8px solid #2d2d38;
    }

    /* Top Action Bar */
    .top-bar {
      background-color: var(--primary-color);
      color: #fff;
      padding: 14px 16px 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar .title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar h1 {
      font-size: 20px;
      font-weight: 500;
    }

    .top-bar a.docs-link {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      transition: 0.2s;
    }
    .top-bar a.docs-link:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Tabs */
    .tabs-bar {
      background-color: var(--primary-color);
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 12px 4px;
      cursor: pointer;
      text-align: center;
      position: relative;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .tab-btn.active {
      color: #ffffff;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10%;
      width: 80%;
      height: 3.5px;
      background-color: #ffffff;
      border-radius: 4px 4px 0 0;
    }

    /* Filter Subheader */
    .filter-bar {
      background-color: #f8f9fa;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-muted);
    }

    .filter-bar select {
      border: none;
      background: transparent;
      font-size: 13px;
      color: var(--text-main);
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    /* Content Area */
    .debt-list {
      flex: 1;
      overflow-y: auto;
      background: #ffffff;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f1f3f4;
      cursor: pointer;
      transition: background 0.15s;
    }

    .list-item:hover {
      background-color: #f8fafd;
    }

    .list-item .left-info {
      flex: 1;
      min-width: 0;
    }

    .list-item .person-title {
      font-size: 15px;
      font-weight: 600;
      color: #202124;
      margin-bottom: 2px;
    }

    .list-item .person-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-item .date-row {
      font-size: 12px;
      color: #80868b;
    }

    .list-item .right-info {
      text-align: right;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .list-item .amount-badge {
      font-size: 14.5px;
      font-weight: 700;
      color: #202124;
      white-space: nowrap;
    }

    .list-item .arrow {
      color: #9aa0a6;
      font-size: 16px;
    }

    /* Individual List Item Specifics */
    .individual-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #f1f3f4;
    }

    .individual-avatar {
      width: 44px;
      height: 44px;
      background: #e8eaed;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #5f6368;
      font-size: 20px;
      font-weight: bold;
      margin-right: 14px;
      flex-shrink: 0;
    }

    .individual-details {
      flex: 1;
    }

    .individual-details .name {
      font-size: 15px;
      font-weight: 600;
      color: #202124;
      margin-bottom: 3px;
    }

    .individual-details .to-from-row {
      font-size: 12px;
      color: #5f6368;
    }

    .individual-details .to-me {
      color: #1254a3;
      font-weight: 500;
    }

    .individual-details .by-me {
      color: #c5221f;
      font-weight: 500;
    }

    .individual-balance {
      font-size: 14px;
      font-weight: 700;
      text-align: right;
    }

    .balance-positive {
      color: #1254a3;
    }

    .balance-negative {
      color: #c5221f;
    }

    /* Bottom Total Bar */
    .bottom-bar {
      background-color: var(--primary-color);
      color: #ffffff;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }

    /* Floating Action Button (FAB) */
    .fab-btn {
      position: absolute;
      bottom: 60px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s, background-color 0.2s;
      z-index: 10;
    }

    .fab-btn:hover {
      transform: scale(1.08);
      background-color: var(--primary-dark);
    }

    /* Modal (New Debt) */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      z-index: 20;
      flex-direction: column;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-header {
      background-color: var(--primary-color);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 500;
    }

    .modal-header .actions {
      display: flex;
      gap: 16px;
      font-size: 22px;
      cursor: pointer;
    }

    .modal-body {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #70757a;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .status-group {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 16px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
      cursor: pointer;
    }

    .paid-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e8eaed;
      margin-bottom: 16px;
      font-size: 14px;
      color: #3c4043;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 4px;
      border: none;
      border-bottom: 1.5px solid #bdc1c6;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: transparent;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-bottom-color: var(--primary-color);
    }

    .amount-currency-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .amount-currency-row input {
      flex: 2;
    }

    .amount-currency-row select {
      flex: 1;
      font-weight: 600;
    }

    .date-row-picker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #e8eaed;
      font-size: 13.5px;
      color: #5f6368;
    }

    .date-row-picker input[type="datetime-local"] {
      border: 1px solid #dadce0;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      color: #202124;
      outline: none;
    }

    .reminder-checkbox {
      margin-top: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12.5px;
      color: #5f6368;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #80868b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Top Action Bar -->
    <div class="top-bar">
      <div class="title-box">
        <span style="font-size: 18px; cursor: pointer;">←</span>
        <h1>Debt Manager</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="/docs" target="_blank" class="docs-link" title="FastAPI Swagger Hujjatlari">Swagger API ↗</a>
        <span style="font-size: 20px; cursor: pointer;">⋮</span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" id="tab-owed-to" onclick="switchTab('owed_to')">OWED TO ME</button>
      <button class="tab-btn" id="tab-owed-by" onclick="switchTab('owed_by')">OWED BY ME</button>
      <button class="tab-btn" id="tab-individual" onclick="switchTab('individual')">INDIVIDUALS</button>
    </div>

    <!-- Filter Subheader -->
    <div class="filter-bar">
      <select id="sortField" onchange="renderCurrentTab()">
        <option value="date_incurred">Date Incurred</option>
        <option value="amount">Amount</option>
        <option value="name">Name</option>
      </select>
      <select id="sortOrder" onchange="renderCurrentTab()">
        <option value="asc">Ascending ▾</option>
        <option value="desc">Descending ▴</option>
      </select>
    </div>

    <!-- Content List -->
    <div class="debt-list" id="debtListContainer">
      <div class="empty-state">Yuklanmoqda...</div>
    </div>

    <!-- Bottom Total Bar -->
    <div class="bottom-bar" id="bottomBar">
      <span>Total: UZS 0.00</span>
    </div>

    <!-- Floating Action Button -->
    <button class="fab-btn" onclick="openNewDebtModal()" title="Yangi qarz qo'shish">+</button>

    <!-- New Debt Modal Screen -->
    <div class="modal-overlay" id="newDebtModal">
      <div class="modal-header">
        <h2>New Debt</h2>
        <div class="actions">
          <span onclick="closeNewDebtModal()" title="Bekor qilish">✕</span>
          <span onclick="submitNewDebt()" title="Saqlash" style="font-weight: bold;">✓</span>
        </div>
      </div>

      <div class="modal-body">
        <div class="section-label">DEBT STATUS</div>

        <div class="status-group">
          <label class="radio-label">
            <input type="radio" name="modal_debt_type" value="owed_to" checked> Owed To Me
          </label>
          <label class="radio-label">
            <input type="radio" name="modal_debt_type" value="owed_by"> Owed By Me
          </label>
        </div>

        <div class="paid-row">
          <input type="checkbox" id="modal_is_paid">
          <label for="modal_is_paid" style="cursor: pointer;">Fully Paid</label>
        </div>

        <div class="form-group">
          <input type="text" id="modal_name" placeholder="Name [REQUIRED]" required />
        </div>

        <div class="form-group">
          <div class="amount-currency-row">
            <input type="number" id="modal_amount" step="0.01" placeholder="Amount [REQUIRED]" required />
            <select id="modal_currency">
              <option value="UZS">UZS</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <input type="text" id="modal_description" placeholder="Description" />
        </div>

        <div class="date-row-picker">
          <span>Date Incurred:</span>
          <input type="datetime-local" id="modal_date_incurred" />
        </div>

        <div class="date-row-picker">
          <span>Date Due:</span>
          <input type="datetime-local" id="modal_date_due" />
        </div>

        <div class="reminder-checkbox">
          <input type="checkbox" id="modal_reminder" checked />
          <label for="modal_reminder">
            Add reminder to calendar<br>
            <span style="font-size: 11px; color: #80868b;">(Adjust default notice period in Settings)</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'owed_to';
    let token = null;

    // Helper: format currency
    function formatMoney(amount, currency = "UZS") {
      const num = Number(amount) || 0;
      return `${currency}${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    // Helper: format date
    function formatDate(dtStr) {
      if (!dtStr) return '-';
      const d = new Date(dtStr);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${d.getDate()} ${months[d.getMonth()]} '${String(d.getFullYear()).slice(-2)}`;
    }

    // Initialize Auth (registers or logs in a default local session user)
    async function initAuth() {
      try {
        const username = "debt_user";
        const password = "password123";

        // Try login
        let res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          // Register
          await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username,
              password,
              email: "debt_user@example.com",
              full_name: "Azizjon"
            })
          });

          // Login after register
          res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
        }

        const data = await res.json();
        token = data.access_token;
        
        // Seed initial sample data if completely empty
        await seedSampleDataIfEmpty();
        
        renderCurrentTab();
      } catch (e) {
        console.error("Auth error:", e);
      }
    }

    async function seedSampleDataIfEmpty() {
      const res = await fetch('/api/debts/', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const debts = await res.json();
      if (debts.length === 0) {
        // Seed exact data from assignment screenshots
        const samples = [
          { person_name: "Tuychi aka", debt_type: "owed_to", amount: 27000, currency: "UZS", description: "Monro kafee, lavash" },
          { person_name: "Tuychi aka", debt_type: "owed_to", amount: 37000, currency: "UZS", description: "" },
          { person_name: "Tuychi aka", debt_type: "owed_by", amount: 51000, currency: "UZS", description: "" },
          { person_name: "Maruf,abduhoshim", debt_type: "owed_to", amount: 60000, currency: "UZS", description: "" },
          { person_name: "Besulton", debt_type: "owed_to", amount: 80000, currency: "UZS", description: "" },
          { person_name: "Azamat", debt_type: "owed_to", amount: 600000, currency: "UZS", description: "" },
          { person_name: "Azamat", debt_type: "owed_to", amount: 500000, currency: "UZS", description: "" },
          { person_name: "Azamat", debt_type: "owed_by", amount: 1786000, currency: "UZS", description: "" },
          { person_name: "AZIZ", debt_type: "owed_to", amount: 50000, currency: "UZS", description: "" },
          { person_name: "AZIZ", debt_type: "owed_to", amount: 100000, currency: "UZS", description: "" },
          { person_name: "AZIZ", debt_type: "owed_by", amount: 1562000, currency: "UZS", description: "" },
          { person_name: "Botir", debt_type: "owed_by", amount: 179000, currency: "UZS", description: "" },
          { person_name: "Building bot", debt_type: "owed_to", amount: 1500000, currency: "UZS", description: "" },
          { person_name: "Building bot", debt_type: "owed_by", amount: 2586000, currency: "UZS", description: "" },
        ];

        for (const item of samples) {
          await fetch('/api/debts/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(item)
          });
        }
      }
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tabName.replace('_', '-')}`).classList.add('active');
      renderCurrentTab();
    }

    async function renderCurrentTab() {
      if (!token) return;
      const container = document.getElementById('debtListContainer');
      const sortField = document.getElementById('sortField').value;
      const sortOrder = document.getElementById('sortOrder').value;

      try {
        const url = `/api/debts/?debt_type=${currentTab}&sort_by=${sortField}&order=${sortOrder}`;
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        // Also fetch monitoring data for bottom total
        const monRes = await fetch('/api/monitoring/', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const monData = await monRes.json();

        container.innerHTML = '';

        if (currentTab === 'individual') {
          // Render Individuals tab
          if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state">Hali hech qanday qarzlar mavjud emas.</div>';
          } else {
            data.forEach(item => {
              const isNegative = item.net_balance < 0;
              const formattedNet = `${isNegative ? '-' : ''}${formatMoney(Math.abs(item.net_balance), item.currency)}`;
              const balanceClass = isNegative ? 'balance-negative' : 'balance-positive';

              const el = document.createElement('div');
              el.className = 'individual-item';
              el.innerHTML = `
                <div class="individual-avatar">👤</div>
                <div class="individual-details">
                  <div class="name">${item.person_name}</div>
                  <div class="to-from-row">
                    To Me: <span class="to-me">${Number(item.total_owed_to).toFixed(2)}</span><br>
                    By Me: <span class="by-me">${Number(item.total_owed_by).toFixed(2)}</span>
                  </div>
                </div>
                <div class="individual-balance ${balanceClass}">
                  ${formattedNet} <span style="color:#9aa0a6; font-weight:normal;">&gt;</span>
                </div>
              `;
              container.appendChild(el);
            });
          }

          const isNetNeg = monData.current_balance < 0;
          document.getElementById('bottomBar').innerHTML = `
            <span>Total: ${isNetNeg ? '-' : ''}${formatMoney(Math.abs(monData.current_balance), monData.default_currency)}</span>
          `;

        } else {
          // Render OWED TO ME or OWED BY ME
          let runningTotal = 0;
          if (!data || data.length === 0) {
            container.innerHTML = `<div class="empty-state">Ushbu bo'limda qarzlar mavjud emas.</div>`;
          } else {
            data.forEach(item => {
              runningTotal += item.amount;
              const el = document.createElement('div');
              el.className = 'list-item';
              el.innerHTML = `
                <div class="left-info">
                  <div class="person-title">${item.person_name}</div>
                  ${item.description ? `<div class="person-desc">${item.description}</div>` : ''}
                  <div class="date-row">
                    Incurred: ${formatDate(item.date_incurred)}<br>
                    Due: ${formatDate(item.date_due)}
                  </div>
                </div>
                <div class="right-info">
                  <div class="amount-badge">${formatMoney(item.amount, item.currency)}</div>
                  <div class="arrow">&gt;</div>
                </div>
              `;
              container.appendChild(el);
            });
          }

          document.getElementById('bottomBar').innerHTML = `
            <span>Total: ${formatMoney(runningTotal, monData.default_currency)}</span>
          `;
        }

      } catch (e) {
        console.error("Fetch error:", e);
        container.innerHTML = '<div class="empty-state">Ma\'lumotlarni yuklashda xatolik yuz berdi.</div>';
      }
    }

    function openNewDebtModal() {
      // Set default datetime to now
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('modal_date_incurred').value = now.toISOString().slice(0, 16);
      document.getElementById('modal_date_due').value = '';
      document.getElementById('modal_name').value = '';
      document.getElementById('modal_amount').value = '';
      document.getElementById('modal_description').value = '';
      document.getElementById('modal_is_paid').checked = false;

      // Match modal debt_type to current tab
      if (currentTab === 'owed_by') {
        document.querySelector('input[name="modal_debt_type"][value="owed_by"]').checked = true;
      } else {
        document.querySelector('input[name="modal_debt_type"][value="owed_to"]').checked = true;
      }

      document.getElementById('newDebtModal').classList.add('active');
    }

    function closeNewDebtModal() {
      document.getElementById('newDebtModal').classList.remove('active');
    }

    async function submitNewDebt() {
      const person_name = document.getElementById('modal_name').value.trim();
      const amount = parseFloat(document.getElementById('modal_amount').value);
      const currency = document.getElementById('modal_currency').value;
      const description = document.getElementById('modal_description').value.trim();
      const debt_type = document.querySelector('input[name="modal_debt_type"]:checked').value;
      const is_paid = document.getElementById('modal_is_paid').checked;
      const date_incurred = document.getElementById('modal_date_incurred').value || null;
      const date_due = document.getElementById('modal_date_due').value || null;
      const reminder_enabled = document.getElementById('modal_reminder').checked;

      if (!person_name) {
        alert("Iltimos, shaxs ismini (Name) kiriting!");
        return;
      }
      if (isNaN(amount) || amount <= 0) {
        alert("Iltimos, to'g'ri qarz miqdorini (Amount) kiriting!");
        return;
      }

      try {
        const payload = {
          person_name,
          debt_type,
          amount,
          currency,
          description: description || null,
          is_paid,
          date_incurred: date_incurred ? new Date(date_incurred).toISOString() : null,
          date_due: date_due ? new Date(date_due).toISOString() : null,
          reminder_enabled
        };

        const res = await fetch('/api/debts/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          closeNewDebtModal();
          renderCurrentTab();
        } else {
          const err = await res.json();
          alert("Xatolik: " + JSON.stringify(err.detail));
        }
      } catch (e) {
        alert("So'rov yuborishda xatolik: " + e.message);
      }
    }

    // Start app
    initAuth();
  </script>
</body>
</html>
